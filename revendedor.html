<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Panel SMM</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0c0f17;
    color: #f1f5f9;
    margin: 0;
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(env(safe-area-inset-bottom) + 70px);
  }

  input, button { font-size: 14px !important; }

  .panel-card {
    background: #121824;
    border: 1px solid #1e2638;
  }

  .input-clean {
    background: #080a10;
    border: 1px solid #1e2638;
    transition: border-color 0.2s;
  }
  .input-clean:focus {
    border-color: #2563eb;
    outline: none;
  }

  .btn-blue {
    background: #2563eb;
    color: #ffffff;
    font-weight: 700;
  }
  .btn-blue:active { opacity: 0.9; transform: scale(0.99); }

  .btn-green {
    background: #059669;
    color: #ffffff;
    font-weight: 700;
  }
  .btn-green:active { opacity: 0.9; transform: scale(0.99); }

  #toast { transition: opacity 0.2s ease; }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
</style>
</head>
<body class="min-h-screen flex flex-col justify-start items-center p-3 sm:p-5">

<!-- TOAST NOTIFICATION -->
<div id="toast" class="fixed top-3 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl text-xs font-bold hidden z-[100] shadow-lg border max-w-[90%] text-center"></div>

<!-- LOGIN SCREEN -->
<div id="login" class="w-full max-w-sm my-auto py-6">
  <form onsubmit="event.preventDefault(); login();" class="panel-card p-5 rounded-2xl border border-[#1e2638] text-center space-y-4">
    <div class="text-2xl font-black tracking-tight text-white flex items-center justify-center gap-2">
      <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      Panel Acceso
    </div>
    
    <div class="space-y-2.5 text-left pt-2">
      <div>
        <label class="text-[10px] font-bold uppercase tracking-wider text-gray-400 block mb-1">Usuario</label>
        <input id="u" autocomplete="username" placeholder="Ingresa tu usuario" class="input-clean w-full p-2.5 rounded-lg text-white placeholder-gray-600">
      </div>
      <div>
        <label class="text-[10px] font-bold uppercase tracking-wider text-gray-400 block mb-1">Contraseña</label>
        <input id="p" type="password" autocomplete="current-password" placeholder="••••••••" class="input-clean w-full p-2.5 rounded-lg text-white placeholder-gray-600">
      </div>
    </div>

    <label class="flex items-center gap-2 text-xs text-gray-400 cursor-pointer select-none">
      <input id="remember" type="checkbox" checked class="w-3.5 h-3.5 accent-blue-600 rounded bg-black"> 
      <span>Recordar mi sesión</span>
    </label>

    <button type="submit" id="btnLogin" class="btn-blue w-full py-2.5 rounded-lg text-xs font-bold transition">
      Iniciar Sesión
    </button>
    <p id="loginErr" class="text-red-400 text-xs mt-1 font-medium min-h-[14px]"></p>
  </form>
</div>

<!-- PANEL PRINCIPAL -->
<div id="panel" style="display:none" class="w-full max-w-md md:max-w-2xl mx-auto space-y-3">
  
  <!-- HEADER & SALDO COMPACTO -->
  <div class="panel-card p-3.5 rounded-xl flex justify-between items-center">
    <div class="min-w-0">
      <div class="text-[10px] uppercase font-bold text-blue-400 tracking-wider">Socio Activo</div>
      <div id="uname" class="font-extrabold text-base text-white truncate"></div>
      <div class="text-[10px] text-gray-400" id="udate"></div>
    </div>
    <div class="text-right shrink-0">
      <div class="text-[9px] text-gray-400 uppercase font-bold">Saldo Disponible</div>
      <div class="text-lg font-black text-emerald-400 font-mono"><span id="bal">0</span></div>
      <button onclick="refreshBal()" class="text-[10px] font-medium bg-white/5 hover:bg-white/10 px-2 py-0.5 rounded-md text-gray-300 mt-0.5 border border-white/5">
        Actualizar
      </button>
    </div>
  </div>

  <!-- ESTADÍSTICAS COMPACTAS -->
  <div class="grid grid-cols-3 gap-2">
    <div class="panel-card p-2 rounded-lg text-center">
      <div class="text-[9px] text-gray-400 uppercase font-bold">Ventas Hoy</div>
      <div id="stHoy" class="font-bold text-emerald-400 text-xs font-mono mt-0.5">0</div>
    </div>
    <div class="panel-card p-2 rounded-lg text-center">
      <div class="text-[9px] text-gray-400 uppercase font-bold">Cargas</div>
      <div id="stCount" class="font-bold text-gray-200 text-xs font-mono mt-0.5">0</div>
    </div>
    <div class="panel-card p-2 rounded-lg text-center">
      <div class="text-[9px] text-gray-400 uppercase font-bold">Clientes</div>
      <div id="stClients" class="font-bold text-gray-200 text-xs font-mono mt-0.5">0</div>
    </div>
  </div>

  <!-- PESTAÑA: CARGAR SALDO (TAB-LOAD) -->
  <div id="tab-load" class="space-y-2">
    <div class="panel-card p-3.5 rounded-xl space-y-3">
      <div class="flex items-center justify-between pb-2 border-b border-white/5">
        <span class="font-bold text-xs text-white">Cargar Saldo a Cliente</span>
        <span class="text-[9px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded font-bold uppercase tracking-wider">Instantáneo</span>
      </div>

      <div>
        <label class="text-[10px] font-bold text-gray-400 block mb-1 uppercase">Usuario Cliente</label>
        <input id="cli" list="clientsList" placeholder="Ej: usuario123 (sin @)" class="input-clean w-full p-2.5 rounded-lg text-xs text-white placeholder-gray-600 font-mono">
        <datalist id="clientsList"></datalist>
      </div>

      <div>
        <label class="text-[10px] font-bold text-gray-400 block mb-1 uppercase">Monto</label>
        <input id="amt" type="number" oninput="checkBalanceLimit()" placeholder="Ej: 50000" class="input-clean w-full p-2.5 rounded-lg text-xs text-white placeholder-gray-600 font-mono">
        <p id="limitWarning" class="text-[10px] text-amber-400 font-semibold mt-1 hidden">
          El monto supera tu saldo disponible.
        </p>
      </div>

      <div class="grid grid-cols-3 gap-1.5">
        <button onclick="setAmt(20000)" class="bg-white/5 hover:bg-white/10 py-1.5 rounded-lg text-xs font-semibold text-gray-300 border border-white/5">20k</button>
        <button onclick="setAmt(50000)" class="bg-white/5 hover:bg-white/10 py-1.5 rounded-lg text-xs font-semibold text-gray-300 border border-white/5">50k</button>
        <button onclick="setAmt(100000)" class="bg-white/5 hover:bg-white/10 py-1.5 rounded-lg text-xs font-semibold text-gray-300 border border-white/5">100k</button>
      </div>

      <button onclick="cargar()" id="btnCargar" class="btn-green w-full py-2.5 rounded-lg text-xs font-bold transition mt-1">
        + Cargar Saldo
      </button>
    </div>

    <!-- ULTIMA CARGA -->
    <div id="lastTxCard" class="panel-card p-2.5 rounded-xl hidden border-emerald-500/20">
      <div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-1.5">
          <span class="text-emerald-400 font-bold">✓</span>
          <span id="lastTxInfo" class="font-bold text-white font-mono"></span>
        </div>
        <span id="lastTxTime" class="text-[10px] text-gray-400"></span>
      </div>
    </div>
  </div>

  <!-- PESTAÑA: CLIENTES (TAB-CLIENTS) -->
  <div id="tab-clients" class="hidden space-y-2">
    <div class="panel-card p-3.5 rounded-xl space-y-2">
      <div class="flex justify-between items-center pb-2 border-b border-white/5">
        <span class="font-bold text-xs text-white">Directorio de Clientes</span>
        <input id="c-search" oninput="renderClients()" placeholder="Buscar..." class="input-clean px-2.5 py-1 rounded-lg text-xs text-white w-28">
      </div>
      <div id="clientsContainer" class="space-y-1.5 max-h-60 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- PESTAÑA: HISTORIAL (TAB-MOVES) -->
  <div id="tab-moves" class="hidden space-y-2">
    <div class="panel-card p-3.5 rounded-xl space-y-2">
      <div class="flex justify-between items-center pb-2 border-b border-white/5">
        <span class="font-bold text-xs text-white">Historial de Transacciones</span>
        <input id="f-search" oninput="renderMoves()" placeholder="Filtrar..." class="input-clean px-2.5 py-1 rounded-lg text-xs text-white w-28">
      </div>
      <div id="moves" class="space-y-1.5 max-h-60 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- PESTAÑA: CONFIGURACIÓN (TAB-SET) -->
  <div id="tab-set" class="hidden space-y-2">
    <div class="panel-card p-3.5 rounded-xl space-y-2.5">
      <span class="font-bold text-xs text-white block pb-1 border-b border-white/5">Ajustes de Cuenta</span>
      <div>
        <label class="text-[10px] text-gray-400 block mb-1">Nueva Contraseña</label>
        <div class="flex gap-1.5">
          <input id="newp" type="password" placeholder="Mínimo 4 letras" class="input-clean flex-1 py-1.5 px-2.5 rounded-lg text-xs text-white">
          <button onclick="changePass()" class="btn-blue px-3 py-1.5 rounded-lg text-xs font-bold shrink-0">Guardar</button>
        </div>
      </div>
    </div>

    <button onclick="logout()" class="w-full bg-red-600/20 border border-red-600/40 text-red-400 hover:bg-red-600/30 py-2 rounded-xl font-bold text-xs transition">
      Cerrar Sesión
    </button>
  </div>
</div>

<!-- NAVEGACIÓN INFERIOR (PROFESIONAL SIN EMOJIS) -->
<nav id="bottomNav" style="display:none" class="fixed bottom-0 left-0 right-0 bg-[#0c0f17]/95 border-t border-[#1e2638] px-3 py-2 flex justify-between items-center z-50 backdrop-blur-md">
  
  <button onclick="switchTab('load')" id="nav-load" class="flex-1 flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 text-blue-400 bg-blue-500/10 border-t-2 border-blue-500">
    <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
    <span class="text-[10px] font-semibold tracking-wide">Recargar</span>
  </button>

  <button onclick="switchTab('clients')" id="nav-clients" class="flex-1 flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 text-gray-400 hover:text-gray-200">
    <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
    <span class="text-[10px] font-semibold tracking-wide">Clientes</span>
  </button>

  <button onclick="switchTab('moves')" id="nav-moves" class="flex-1 flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 text-gray-400 hover:text-gray-200">
    <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
    <span class="text-[10px] font-semibold tracking-wide">Historial</span>
  </button>

  <button onclick="switchTab('set')" id="nav-set" class="flex-1 flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 text-gray-400 hover:text-gray-200">
    <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
    <span class="text-[10px] font-semibold tracking-wide">Ajustes</span>
  </button>

</nav>

<script>
const API='https://seguidoresjavicellpy.up.railway.app/api';
let RU='', RP='', MOVES=[], CLIENTS=[], CURRENT_BAL = 0;

function formatNum(val) {
  const num = Number(val);
  return isNaN(num) ? '0' : num.toLocaleString('es-PY');
}

function showToast(msg, ok=true){
  const t=document.getElementById('toast');
  t.innerHTML=msg;
  t.style.background=ok?'#064e3b':'#7f1d1d';
  t.style.borderColor=ok?'#059669':'#dc2626';
  t.style.color='#ffffff';
  t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'),2500);
}

function switchTab(tabId){
  ['load','clients','moves','set'].forEach(t => {
    const el = document.getElementById('tab-' + t);
    const nav = document.getElementById('nav-' + t);
    if(el) el.classList.add('hidden');
    if(nav) nav.className = 'flex-1 flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 text-gray-400 hover:text-gray-200 border-t-2 border-transparent';
  });

  const activeEl = document.getElementById('tab-' + tabId);
  const activeNav = document.getElementById('nav-' + tabId);
  if(activeEl) activeEl.classList.remove('hidden');
  if(activeNav) activeNav.className = 'flex-1 flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 text-blue-400 bg-blue-500/10 border-t-2 border-blue-500 font-bold';
}

function setAmt(v){
  document.getElementById('amt').value=v;
  checkBalanceLimit();
}

function checkBalanceLimit(){
  const amount=Number(document.getElementById('amt').value||0);
  document.getElementById('limitWarning').classList.toggle('hidden', amount <= CURRENT_BAL);
}

async function login(){
  RU=document.getElementById('u').value.toLowerCase().trim();
  RP=document.getElementById('p').value;
  if(!RU||!RP) return err('Completa los campos');
  const btn=document.getElementById('btnLogin');
  btn.disabled=true;
  btn.textContent='Ingresando...';
  err('');
  try{
    const r=await fetch(API+'/reseller-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:RU,pass:RP})});
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    if(document.getElementById('remember').checked){
      localStorage.setItem('res_sess',JSON.stringify({u:RU,p:RP}));
    } else {
      localStorage.removeItem('res_sess');
    }
    showPanel(d);
  }catch(e){
    err(e.message);
  }
  btn.disabled=false;
  btn.textContent='Iniciar Sesión';
}

function err(m){ document.getElementById('loginErr').textContent=m; }

function showPanel(d){
  document.getElementById('login').style.display='none';
  document.getElementById('panel').style.display='block';
  document.getElementById('bottomNav').style.display='flex';
  document.getElementById('uname').textContent=d.user;
  document.getElementById('udate').textContent=new Date().toLocaleDateString();
  
  CURRENT_BAL = Number(d.balance||0);
  document.getElementById('bal').textContent=formatNum(CURRENT_BAL);
  loadMoves();
}

async function refreshBal(){
  try{
    const r=await fetch(API+'/reseller-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:RU,pass:RP})});
    const d=await r.json();
    if(!d.error){
      CURRENT_BAL = Number(d.balance||0);
      document.getElementById('bal').textContent=formatNum(CURRENT_BAL);
      checkBalanceLimit();
      showToast('Saldo actualizado');
    }
  }catch(e){}
}

async function cargar(){
  const client=document.getElementById('cli').value.trim().toLowerCase().replace('@','');
  const amount=Number(document.getElementById('amt').value);
  if(!client) return showToast('Ingresa el usuario', false);
  if(!amount||amount<1000) return showToast('Mínimo: 1.000', false);
  if(amount > CURRENT_BAL) return showToast('Saldo insuficiente', false);
  if(!confirm(`¿Cargar ${formatNum(amount)} a @${client}?`)) return;
  
  const btn=document.getElementById('btnCargar');
  btn.disabled=true;
  btn.textContent='Procesando...';
  try{
    const r=await fetch(API+'/reseller-load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reseller_user:RU,reseller_pass:RP,client_username:client,amount})});
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    
    showToast(`Éxito a @${client}`);
    CURRENT_BAL = Number(d.new_balance||0);
    document.getElementById('bal').textContent=formatNum(CURRENT_BAL);
    
    document.getElementById('lastTxCard').classList.remove('hidden');
    document.getElementById('lastTxInfo').textContent = `@${client} • ${formatNum(amount)}`;
    document.getElementById('lastTxTime').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

    document.getElementById('cli').value='';
    document.getElementById('amt').value='';
    checkBalanceLimit();
    loadMoves();
  }catch(e){
    showToast(e.message, false);
  }
  btn.disabled=false;
  btn.textContent='+ Cargar Saldo';
}

async function loadMoves(){
  try{
    const r=await fetch(API+'/reseller-moves/'+encodeURIComponent(RU));
    const d=await r.json();
    MOVES=Array.isArray(d)?d:[];
    
    CLIENTS = [...new Set(MOVES.map(m=>m.client).filter(Boolean))];
    document.getElementById('clientsList').innerHTML=CLIENTS.map(c=>`<option value="${c}">`).join('');
    
    renderClients();
    renderMoves();
    updateStats();
  }catch(e){}
}

function renderClients(){
  const q=(document.getElementById('c-search').value||'').toLowerCase();
  const list=CLIENTS.filter(c=>c.toLowerCase().includes(q));
  document.getElementById('clientsContainer').innerHTML=list.map(c=>`
    <div onclick="selectClient('${c}')" class="bg-[#080a10] p-2 rounded-lg flex justify-between items-center border border-[#1e2638] cursor-pointer hover:border-blue-500/50">
      <div class="font-mono text-xs font-bold text-white">@${c}</div>
      <div class="text-blue-400 font-bold text-xs">Cargar ➔</div>
    </div>
  `).join('')||'<p class="text-gray-500 text-xs text-center py-2">Sin registros</p>';
}

function selectClient(c){
  document.getElementById('cli').value=c;
  switchTab('load');
  showToast(`@${c} seleccionado`);
}

function renderMoves(){
  const q=(document.getElementById('f-search').value||'').toLowerCase();
  const list=MOVES.filter(m=>(m.client||'').toLowerCase().includes(q));
  document.getElementById('moves').innerHTML=list.slice(0,100).map(m=>`
    <div class="bg-[#080a10] p-2 rounded-lg flex justify-between items-center border border-[#1e2638]">
      <div class="min-w-0 pr-2">
        <div class="font-mono text-xs font-bold text-white truncate">@${m.client}</div>
        <div class="text-[9px] text-gray-500">${(m.date||'').slice(0,10)}</div>
      </div>
      <div class="text-emerald-400 font-bold text-xs font-mono">${formatNum(m.amount)}</div>
    </div>
  `).join('')||'<p class="text-gray-500 text-xs text-center py-2">Sin registros</p>';
}

function updateStats(){
  const today=new Date().toISOString().slice(0,10);
  const hoy=MOVES.filter(m=>(m.date||'').slice(0,10)===today).reduce((s,m)=>s+Number(m.amount||0),0);
  document.getElementById('stHoy').textContent=formatNum(hoy);
  document.getElementById('stCount').textContent=MOVES.length;
  document.getElementById('stClients').textContent=CLIENTS.length;
}

async function changePass(){
  const np=document.getElementById('newp').value.trim();
  if(np.length<4) return showToast('Mínimo 4 caracteres', false);
  try{
    const r=await fetch(API+'/reseller-change-pass',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:RU,pass:RP,newPass:np})});
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    RP=np;
    if(localStorage.getItem('res_sess')){
      localStorage.setItem('res_sess',JSON.stringify({u:RU,p:RP}));
    }
    showToast('Contraseña actualizada');
    document.getElementById('newp').value='';
  }catch(e){
    showToast(e.message, false);
  }
}

function logout(){
  localStorage.removeItem('res_sess');
  location.reload();
}

(function(){
  const s=JSON.parse(localStorage.getItem('res_sess')||'null');
  if(s){
    document.getElementById('u').value=s.u;
    document.getElementById('p').value=s.p;
    login();
  }
})();
</script>
</body>
</html>
