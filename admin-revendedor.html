<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Admin Revendedores & Clientes 🦊 v2 - Privado</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    background: #06080d;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #f8fafc;
    margin: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* Prevenir zoom excesivo en iOS */
  input, select, textarea, button {
    font-size: 16px !important;
  }
  @media (min-width: 768px) {
    input, select, textarea, button {
      font-size: 14px !important;
    }
  }
  /* Tarjetas y contenedores Dark Luxury */
  .card-premium {
    background: #101520;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 1.25rem;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
  }
  .glass-input {
    background: #06080d;
    border: 1px solid rgba(255, 255, 255, 0.12);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .glass-input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    outline: none;
  }
  /* Pestañas inactivas y activas */
  .tab-btn {
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid transparent;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: #ffffff;
    border-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
  }
  .tab-btn:not(.active) {
    background: rgba(255, 255, 255, 0.03);
    color: #94a3b8;
    border-color: rgba(255, 255, 255, 0.08);
  }
  .tab-btn:not(.active):hover {
    background: rgba(255, 255, 255, 0.08);
    color: #f8fafc;
  }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: #06080d; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start antialiased p-3 sm:p-6">

<!-- TOAST NOTIFICATION -->
<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl font-bold hidden z-[100] shadow-2xl border border-white/10 max-w-[92%] text-center text-xs sm:text-sm"></div>

<!-- LOCK SCREEN -->
<div id="lock" class="min-h-[85vh] w-full flex items-center justify-center p-2">
  <div class="card-premium p-6 sm:p-8 w-full max-w-sm text-center">
    <div class="w-14 h-14 bg-gradient-to-br from-orange-500 to-red-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 shadow-lg shadow-orange-500/20">🦊</div>
    <h1 class="font-black text-xl text-white mb-1">Admin Panel v2</h1>
    <p class="text-xs text-gray-400 mb-6 font-medium">JaviCell PY • Acceso Privado</p>
    <input id="key" type="password" placeholder="Clave maestra" class="glass-input w-full p-3.5 rounded-xl mb-3 text-white placeholder-gray-500" onkeydown="if(event.key==='Enter')unlock()">
    <button onclick="unlock()" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 py-3.5 rounded-xl font-bold text-white shadow-lg active:scale-[0.98] transition">Entrar al Sistema</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="main" class="hidden w-full max-w-4xl mx-auto space-y-4 pb-12">
  
  <!-- HEADER & NAVEGACIÓN POR PESTAÑAS -->
  <div class="card-premium p-4 sm:p-5 space-y-4">
    <div class="flex flex-row justify-between items-center gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 bg-gradient-to-br from-orange-500 to-red-600 rounded-xl flex items-center justify-center text-xl shrink-0 shadow-md shadow-orange-500/20">🦊</div>
        <div>
          <h1 class="font-black text-base sm:text-xl text-white leading-tight">Panel Principal</h1>
          <p class="text-[11px] text-gray-400 font-medium">Gestión Integral de Usuarios</p>
        </div>
      </div>
      <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-red-400 px-3 py-1.5 rounded-xl text-xs font-bold active:scale-95 transition shrink-0">
        🚪 Salir
      </button>
    </div>

    <!-- BOTONES PROFESIONALES DE NAVEGACIÓN (TABS) -->
    <div class="grid grid-cols-2 gap-2 bg-black/40 p-1.5 rounded-2xl border border-white/5">
      <button id="tabBtnClients" onclick="switchTab('clients')" class="tab-btn active py-3 px-4 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 active:scale-95">
        <span>👥</span>
        <span>Clientes</span>
        <span id="badgeClientsCount" class="bg-white/20 text-white text-[10px] px-2 py-0.5 rounded-full font-extrabold ml-1">0</span>
      </button>
      <button id="tabBtnResellers" onclick="switchTab('resellers')" class="tab-btn py-3 px-4 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 active:scale-95">
        <span>🤝</span>
        <span>Revendedores</span>
        <span id="badgeResellersCount" class="bg-white/20 text-white text-[10px] px-2 py-0.5 rounded-full font-extrabold ml-1">0</span>
      </button>
    </div>
  </div>

  <!-- PESTAÑA 1: GESTIÓN DE CLIENTES -->
  <div id="tabClientsView" class="space-y-4">
    
    <!-- TARJETA CARGA / RETIRO RÁPIDO DE CLIENTES -->
    <div class="card-premium p-5 sm:p-6 space-y-3 bg-gradient-to-br from-[#101520] to-[#141b2c]">
      <div class="flex items-center justify-between pb-2 border-b border-white/5">
        <h3 class="font-bold text-sm text-white flex items-center gap-1.5">
          <span>💸</span> Modificar Saldo de Cliente
        </h3>
        <span class="text-[10px] text-emerald-400 font-semibold uppercase bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-full">Operación Directa</span>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
        <div>
          <label class="text-[11px] font-semibold text-gray-400 block mb-1">Usuario Cliente</label>
          <input id="adminClientName" list="adminUsersDatalist" placeholder="🔍 Escribe o selecciona cliente..." class="glass-input w-full p-3 rounded-xl text-white placeholder-gray-500">
          <datalist id="adminUsersDatalist"></datalist>
        </div>
        <div>
          <label class="text-[11px] font-semibold text-gray-400 block mb-1">Monto en Guaraníes (₲)</label>
          <input id="adminClientAmt" type="number" placeholder="Ej: 50000" class="glass-input w-full p-3 rounded-xl text-white placeholder-gray-500">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="adminLoadClientBal(1)" id="btnAdminAddC" class="bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold text-sm text-white active:scale-95 transition shadow-lg shadow-emerald-600/20">
          ＋ Cargar Saldo
        </button>
        <button onclick="adminLoadClientBal(-1)" id="btnAdminSubC" class="bg-red-600 hover:bg-red-500 py-3 rounded-xl font-bold text-sm text-white active:scale-95 transition shadow-lg shadow-red-600/20">
          － Descontar Saldo
        </button>
      </div>
    </div>

    <!-- LISTA DE CLIENTES -->
    <div class="card-premium p-5 sm:p-6 space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
        <h3 class="font-bold text-sm text-white flex items-center gap-1.5">
          <span>📋</span> Lista Registrada de Clientes
        </h3>
        <span id="statClientsTotal" class="text-xs text-blue-400 font-semibold bg-blue-500/10 border border-blue-500/20 px-2.5 py-1 rounded-full">
          Total en Clientes: ₲0
        </span>
      </div>

      <div class="flex gap-2">
        <input id="searchClients" oninput="renderClientsList()" placeholder="🔍 Buscar cliente por usuario..." class="glass-input flex-1 p-3 rounded-xl text-white placeholder-gray-500">
        <button onclick="loadAdminUsers()" class="bg-white/10 hover:bg-white/15 border border-white/10 px-4 rounded-xl text-sm transition active:scale-95">🔄</button>
      </div>

      <div id="clientsListContainer" class="space-y-2.5 max-h-[55vh] overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- PESTAÑA 2: GESTIÓN DE REVENDEDORES -->
  <div id="tabResellersView" class="hidden space-y-4">
    
    <!-- ESTADÍSTICAS REVENDEDORES -->
    <div class="grid grid-cols-3 gap-2">
      <div class="card-premium p-3 text-center">
        <div class="text-[10px] text-gray-400 uppercase font-bold">Total saldo</div>
        <div id="statTotal" class="font-black text-emerald-400 text-xs sm:text-base mt-0.5 truncate">₲0</div>
      </div>
      <div class="card-premium p-3 text-center">
        <div class="text-[10px] text-gray-400 uppercase font-bold">Activos</div>
        <div id="statActive" class="font-black text-white text-xs sm:text-base mt-0.5">0</div>
      </div>
      <div class="card-premium p-3 text-center">
        <div class="text-[10px] text-gray-400 uppercase font-bold">Pausados</div>
        <div id="statPaused" class="font-black text-yellow-400 text-xs sm:text-base mt-0.5">0</div>
      </div>
    </div>

    <!-- FORMULARIO CREAR REVENDEDOR -->
    <div class="card-premium p-5 sm:p-6 space-y-3">
      <h3 class="font-bold text-sm text-white flex items-center gap-1.5">
        <span>➕</span> Crear Nuevo Revendedor
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
        <input id="nUser" placeholder="Usuario (ej: juan_py)" class="glass-input p-3 rounded-xl text-white placeholder-gray-500 font-mono">
        <input id="nPass" placeholder="Contraseña" class="glass-input p-3 rounded-xl text-white placeholder-gray-500">
        <input id="nBal" type="number" placeholder="Saldo inicial ₲" class="glass-input p-3 rounded-xl text-white placeholder-gray-500">
        <input id="nNote" placeholder="Nota interna (ej: paga lunes)" class="glass-input p-3 rounded-xl text-white placeholder-gray-500">
      </div>
      <button onclick="createR()" id="btnCreate" class="w-full bg-blue-600 hover:bg-blue-500 py-3.5 rounded-xl font-bold text-sm text-white shadow-lg active:scale-[0.98] transition">
        Crear revendedor
      </button>
    </div>

    <!-- LISTA DE REVENDEDORES -->
    <div class="card-premium p-5 sm:p-6">
      <div class="flex gap-2 mb-4">
        <input id="search" oninput="render()" placeholder="🔍 Buscar revendedor..." class="glass-input flex-1 p-3 rounded-xl text-white placeholder-gray-500">
        <button onclick="loadList()" class="bg-white/10 hover:bg-white/15 border border-white/10 px-4 rounded-xl text-sm transition active:scale-95">🔄</button>
      </div>
      <div id="list" class="space-y-2.5 max-h-[50vh] overflow-y-auto pr-1"></div>
    </div>
  </div>

</div>

<!-- MODAL DETALLES REVENDEDOR -->
<div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-3 z-50 backdrop-blur-sm">
  <div class="card-premium p-5 sm:p-6 w-full max-w-md max-h-[90vh] overflow-y-auto space-y-4 border border-white/10">
    <div class="flex justify-between items-start">
      <div>
        <h3 class="font-black text-base text-white">👤 <span id="m-user"></span></h3>
        <p id="m-note" class="text-xs text-gray-400 mt-0.5"></p>
      </div>
      <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg font-bold px-2">✕</button>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <input id="m-amt" type="number" placeholder="Monto ₲" class="glass-input p-3 rounded-xl text-white placeholder-gray-500 col-span-2">
      <button onclick="mAdd(1)" class="bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold text-sm text-white active:scale-95 transition">+ Cargar</button>
      <button onclick="mAdd(-1)" class="bg-orange-600 hover:bg-orange-500 py-3 rounded-xl font-bold text-sm text-white active:scale-95 transition">- Descontar</button>
    </div>

    <div class="flex gap-2">
      <input id="m-pass" placeholder="Nueva contraseña" class="glass-input flex-1 p-3 rounded-xl text-white placeholder-gray-500">
      <button onclick="mPass()" class="bg-blue-600 hover:bg-blue-500 px-4 rounded-xl text-sm font-bold text-white active:scale-95 transition">🔑 Cambiar</button>
    </div>

    <div class="flex gap-2">
      <input id="m-noteIn" placeholder="Nota interna" class="glass-input flex-1 p-3 rounded-xl text-white placeholder-gray-500">
      <button onclick="mSaveNote()" class="bg-purple-600 hover:bg-purple-500 px-4 rounded-xl text-sm font-bold text-white active:scale-95 transition">💾 Guardar</button>
    </div>

    <div>
      <h4 class="font-bold text-xs uppercase text-gray-400 tracking-wider mb-2">📜 Últimos movimientos</h4>
      <div id="m-moves" class="space-y-1.5 text-xs max-h-48 overflow-y-auto pr-1"></div>
    </div>

    <div class="flex gap-2 pt-2 border-t border-white/5">
      <button onclick="mToggle()" id="m-toggleBtn" class="flex-1 bg-white/10 hover:bg-white/15 py-3 rounded-xl text-xs font-bold text-white active:scale-95 transition">⏸️ Pausar</button>
      <button onclick="closeModal()" class="flex-1 bg-white/5 hover:bg-white/10 py-3 rounded-xl text-xs font-bold text-gray-300 active:scale-95 transition">Cerrar</button>
    </div>

    <button onclick="mDelete()" class="w-full mt-1 text-red-400 hover:text-red-300 text-xs py-2 font-semibold">Eliminar definitivamente</button>
  </div>
</div>

<script>
const API = 'https://seguidoresjavicellpy.up.railway.app/api';
const MASTER_KEY = 'Romi';
const H = {'Content-Type': 'application/json', 'x-master-key': MASTER_KEY};

let DATA = [];
let CLIENTS_DATA = [];
let SEL = null;

function showToast(msg, ok = true) {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.style.background = ok ? '#065f46' : '#991b1b';
  t.style.borderColor = ok ? '#34d399' : '#f87171';
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 3000);
}

function unlock() {
  if (document.getElementById('key').value === MASTER_KEY) {
    sessionStorage.setItem('adm_res', '1');
    document.getElementById('lock').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
    loadList();
    loadAdminUsers();
  } else {
    showToast('❌ Clave incorrecta', false);
  }
}

if (sessionStorage.getItem('adm_res') === '1') {
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  setTimeout(() => { loadList(); loadAdminUsers(); }, 100);
}

function switchTab(tab) {
  const cBtn = document.getElementById('tabBtnClients');
  const rBtn = document.getElementById('tabBtnResellers');
  const cView = document.getElementById('tabClientsView');
  const rView = document.getElementById('tabResellersView');

  if (tab === 'clients') {
    cBtn.classList.add('active');
    rBtn.classList.remove('active');
    cView.classList.remove('hidden');
    rView.classList.add('hidden');
  } else {
    rBtn.classList.add('active');
    cBtn.classList.remove('active');
    rView.classList.remove('hidden');
    cView.classList.add('hidden');
  }
}

async function loadAdminUsers() {
  try {
    const users = await fetch(API + '/users', { headers: { 'x-master-key': MASTER_KEY } }).then(r => r.json());
    if (Array.isArray(users)) {
      CLIENTS_DATA = users;
      document.getElementById('badgeClientsCount').textContent = CLIENTS_DATA.length;
      document.getElementById('adminUsersDatalist').innerHTML = CLIENTS_DATA.map(u => `<option value="${u.username}">`).join('');
      renderClientsList();
    }
  } catch (e) {
    console.error('Error cargando lista de clientes', e);
  }
}

function renderClientsList() {
  const q = (document.getElementById('searchClients').value || '').toLowerCase().trim();
  const filtered = CLIENTS_DATA.filter(u => (u.username || '').toLowerCase().includes(q));
  const totalBal = filtered.reduce((acc, u) => acc + Number(u.balance || 0), 0);

  document.getElementById('statClientsTotal').textContent = 'Total en Clientes: ₲' + totalBal.toLocaleString();

  const container = document.getElementById('clientsListContainer');
  container.innerHTML = filtered.map(u => `
    <div class="bg-black/30 border border-white/5 p-3.5 rounded-xl flex justify-between items-center hover:bg-white/5 transition">
      <div class="min-w-0 pr-2">
        <div class="font-mono font-bold text-xs sm:text-sm text-blue-300 truncate">@${u.username}</div>
        <div class="text-[10px] text-gray-500 truncate mt-0.5">Cliente Oficial</div>
      </div>
      <div class="text-right shrink-0">
        <div class="font-black text-emerald-400 text-xs sm:text-sm">₲${Number(u.balance || 0).toLocaleString()}</div>
        <button onclick="selectClientForLoad('${u.username}')" class="text-[10px] bg-white/10 hover:bg-white/20 px-2 py-0.5 rounded-full text-gray-300 font-semibold mt-1 transition">
          ⚡ Cargar
        </button>
      </div>
    </div>
  `).join('') || '<p class="text-gray-500 text-xs text-center py-8">No se encontraron clientes</p>';
}

function selectClientForLoad(username) {
  document.getElementById('adminClientName').value = username;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function adminLoadClientBal(sign) {
  const username = document.getElementById('adminClientName').value.trim().toLowerCase().replace('@', '');
  const amount = Number(document.getElementById('adminClientAmt').value);
  if (!username) return showToast('⚠️ Ingresa o selecciona un cliente', false);
  if (!amount || amount <= 0) return showToast('⚠️ Ingresa un monto válido', false);

  if (sign < 0 && !confirm(`¿Estás seguro de retirar ₲${amount.toLocaleString()} al cliente @${username}?`)) return;
  if (sign > 0 && !confirm(`¿Confirmas cargar ₲${amount.toLocaleString()} al cliente @${username}?`)) return;

  try {
    const r = await fetch(API + '/add-balance', {
      method: 'POST',
      headers: H,
      body: JSON.stringify({ username, amount: amount * sign })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    showToast(`✅ Saldo actualizado en @${username}`);
    document.getElementById('adminClientName').value = '';
    document.getElementById('adminClientAmt').value = '';
    loadAdminUsers();
  } catch (e) {
    showToast('❌ ' + e.message, false);
  }
}

async function createR() {
  const user = document.getElementById('nUser').value.trim().toLowerCase();
  const pass = document.getElementById('nPass').value;
  const balance = Number(document.getElementById('nBal').value || 0);
  const note = document.getElementById('nNote').value.trim();
  if (!user || !pass) return showToast('⚠️ Completa usuario y contraseña', false);

  const b = document.getElementById('btnCreate');
  b.disabled = true;
  b.textContent = 'Creando...';
  try {
    const r = await fetch(API + '/admin/reseller-create', { method: 'POST', headers: H, body: JSON.stringify({ user, pass, balance, note }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);

    showToast('✅ Revendedor creado con éxito');
    ['nUser', 'nPass', 'nBal', 'nNote'].forEach(i => document.getElementById(i).value = '');
    loadList();
  } catch (e) {
    showToast('❌ ' + e.message, false);
  }
  b.disabled = false;
  b.textContent = 'Crear revendedor';
}

async function loadList() {
  try {
    DATA = await fetch(API + '/admin/resellers', { headers: { 'x-master-key': MASTER_KEY } }).then(r => r.json());
    if (Array.isArray(DATA)) {
      document.getElementById('badgeResellersCount').textContent = DATA.length;
    }
    render();
  } catch (e) {
    console.error(e);
    document.getElementById('list').innerHTML = '<p class="text-red-400 text-center py-6">Error al conectar con el servidor</p>';
  }
}

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const list = DATA.filter(r => r.user.toLowerCase().includes(q));
  const total = list.reduce((s, r) => s + Number(r.balance || 0), 0);
  const paused = list.filter(r => r.active === false).length;

  document.getElementById('statTotal').textContent = '₲' + total.toLocaleString();
  document.getElementById('statActive').textContent = list.length - paused;
  document.getElementById('statPaused').textContent = paused;

  document.getElementById('list').innerHTML = list.map(r => {
    const p = r.active === false;
    return `
      <div onclick="openModal('${r.user}')" class="bg-black/30 border border-white/5 p-3.5 rounded-xl flex justify-between items-center cursor-pointer hover:bg-white/5 transition ${p ? 'opacity-50' : ''}">
        <div class="min-w-0 pr-2">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-mono font-bold text-xs sm:text-sm ${p ? 'line-through text-gray-500' : 'text-blue-300'} truncate">@${r.user}</span>
            ${p ? '<span class="text-[9px] bg-yellow-600/30 text-yellow-300 border border-yellow-500/30 px-2 py-0.5 rounded-full font-bold">PAUSADO</span>' : ''}
          </div>
          <div class="text-[11px] text-gray-500 truncate mt-0.5">${r.note || 'Sin nota'}</div>
        </div>
        <div class="text-right shrink-0">
          <div class="font-black text-emerald-400 text-xs sm:text-sm">₲${Number(r.balance).toLocaleString()}</div>
          <div class="text-[10px] text-gray-500">ver ➔</div>
        </div>
      </div>`;
  }).join('') || '<p class="text-gray-500 text-xs text-center py-8">Sin resultados encontrados</p>';
}

function openModal(user) {
  SEL = user;
  const o = DATA.find(r => r.user === user) || {};
  document.getElementById('m-user').textContent = '@' + user;
  document.getElementById('m-note').textContent = o.note || 'Sin nota interna';
  document.getElementById('m-noteIn').value = o.note || '';
  document.getElementById('m-toggleBtn').textContent = o.active === false ? '▶️ Activar' : '⏸️ Pausar';
  document.getElementById('modal').classList.remove('hidden');
  loadMoves();
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  SEL = null;
}

async function loadMoves() {
  try {
    const d = await fetch(API + '/reseller-moves/' + encodeURIComponent(SEL)).then(r => r.json());
    document.getElementById('m-moves').innerHTML = Array.isArray(d) && d.length ? d.slice(0, 30).map(m => `
      <div class="bg-black/40 p-2 rounded-lg flex justify-between items-center border border-white/5">
        <span class="text-gray-300 truncate pr-2">@${m.client} <span class="text-[10px] text-gray-500">${(m.date || '').slice(0, 10)}</span></span>
        <b class="text-emerald-400 shrink-0">₲${Number(m.amount).toLocaleString()}</b>
      </div>
    `).join('') : '<p class="text-gray-500 text-xs text-center py-4">Sin movimientos recientes</p>';
  } catch (e) {
    console.error(e);
  }
}

async function mAdd(s) {
  const amt = Number(document.getElementById('m-amt').value) * s;
  if (!amt) return showToast('⚠️ Ingresa un monto válido', false);
  if (!confirm(`${amt > 0 ? '+' : '-'} ₲${Math.abs(amt).toLocaleString()} a @${SEL}?`)) return;

  await fetch(API + '/admin/reseller-add', { method: 'POST', headers: H, body: JSON.stringify({ user: SEL, amount: amt }) });
  document.getElementById('m-amt').value = '';
  showToast('✅ Operación realizada');
  await loadList();
  openModal(SEL);
}

async function mPass() {
  const np = document.getElementById('m-pass').value.trim();
  if (np.length < 4) return showToast('⚠️ Mínimo 4 caracteres', false);
  await fetch(API + '/admin/reseller-pass', { method: 'POST', headers: H, body: JSON.stringify({ user: SEL, newPass: np }) });
  showToast('✅ Contraseña actualizada');
  document.getElementById('m-pass').value = '';
}

async function mSaveNote() {
  const note = document.getElementById('m-noteIn').value.trim();
  await fetch(API + '/admin/reseller-note', { method: 'POST', headers: H, body: JSON.stringify({ user: SEL, note }) });
  showToast('✅ Nota guardada');
  loadList();
  openModal(SEL);
}

async function mToggle() {
  await fetch(API + '/admin/reseller-toggle', { method: 'POST', headers: H, body: JSON.stringify({ user: SEL }) });
  showToast('✅ Estado actualizado');
  await loadList();
  openModal(SEL);
}

async function mDelete() {
  if (!confirm(`¿Estás seguro de eliminar definitivamente a @${SEL}?`)) return;
  await fetch(API + '/admin/reseller-delete', { method: 'POST', headers: H, body: JSON.stringify({ user: SEL }) });
  showToast('🗑️ Revendedor eliminado');
  closeModal();
  loadList();
}

function logout() {
  sessionStorage.removeItem('adm_res');
  location.reload();
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
</script>
</body>
